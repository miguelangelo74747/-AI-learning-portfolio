; Wrist Rest-Tremor Analyzer — Equipo 11
; Proyecto PlatformIO para ESP32-S3-DevKitC-1 (N16R8) + MPU6050 (GY-521).
;
;   pio run -e esp32s3                 -> compilar el firmware
;   pio run -e esp32s3 -t upload       -> flashear
;   pio device monitor -e esp32s3      -> ver el log (y guardarlo con log2file)
;   pio test -e native                 -> pruebas unitarias del DSP en el PC

[platformio]
default_envs = esp32s3

[env:esp32s3]
; Plataforma fijada: Arduino-ESP32 2.0.17 (ESP-IDF 4.4). El código también
; compila con el núcleo 3.x (ver ESP_ARDUINO_VERSION_MAJOR en el firmware).
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Módulo N16R8: 16 MB de flash QIO + 8 MB de PSRAM octal.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Se usa el puerto USB "UART" de la placa (puente USB-serie -> UART0).
monitor_speed = 921600
upload_speed = 921600
; time     -> marca de tiempo del PC en cada línea (reloj secundario)
; log2file -> guarda todo en platformio-device-monitor-*.log
monitor_filters = time, log2file

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

[env:native]
; Pruebas en el PC de la librería lib/tremor (FFT, métricas C1–C4, episodios).
platform = native
test_framework = unity
build_flags = -std=gnu++17
